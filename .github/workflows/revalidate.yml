name: Daily revalidate (safety net)

# Pings the on-demand revalidation endpoint once a day so project data never
# goes more than ~24h stale, even if a repo's notify workflow is missing.
# Requires two repo secrets:
#   SITE_URL           e.g. https://your-portfolio.vercel.app
#   REVALIDATE_SECRET  the same value set in Vercel env vars
on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger revalidation
        run: |
          if [ -z "${{ secrets.SITE_URL }}" ] || [ -z "${{ secrets.REVALIDATE_SECRET }}" ]; then
            echo "SITE_URL / REVALIDATE_SECRET secrets not set — skipping."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.SITE_URL }}/api/revalidate?secret=${{ secrets.REVALIDATE_SECRET }}"
          echo "Revalidation triggered."
